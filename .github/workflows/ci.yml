name: CI

# Milestone 0 scope (SRS §23) was lint + type-check only, since the only
# endpoint was a health check with no meaningful business-logic tests to
# gate on. Milestone 1 (auth) is the first milestone with real unit,
# integration, and API-level tests, so `backend-tests` (with a real,
# containerized Postgres service, matching docker-compose.yml's `db`
# service) is added here per TEST-020/§18.4. Milestone 5 (frontend
# build-out) adds `frontend-tests` (TEST-010: Vitest + RTL component tests)
# and a production build check alongside the type-check job already in
# place from that milestone's tooling setup. Milestone 7 adds `e2e-tests`
# (TEST-011: Playwright against the real Docker Compose stack) — see
# e2e/README.md for what it covers and how it's isolated from every
# deployed environment. Milestone 6 adds the A11Y-007 axe-core regression
# gate as another spec file (`e2e/a11y.spec.ts`) in that same job — it needs
# the identical real-rendered-app-via-Playwright setup, so a separate job
# would only duplicate the stack-startup steps below for no benefit.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint-typecheck:
    name: Backend / lint + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint (BE-040, NFR-004)
        run: ruff check .

      - name: Ruff format check (BE-040, NFR-004)
        run: ruff format --check .

      - name: mypy strict (BE-040, NFR-003)
        run: mypy app alembic tests

  backend-tests:
    name: Backend / unit + integration + API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Mirrors docker-compose.yml's `db` service. TEST-002 forbids
      # SQLite-as-a-stand-in (citext/enums/tsvector don't behave
      # identically), so this MUST be real Postgres, not an in-memory swap.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: punah
          POSTGRES_PASSWORD: punah
          POSTGRES_DB: punah_pustak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U punah -d punah_pustak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://punah:punah@localhost:5432/punah_pustak
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply migrations (sets up this job's ephemeral test database — see docs/deployment.md for how production migrates)
        run: alembic upgrade head

      - name: pytest (TEST-001/002/003, randomized order via pytest-randomly)
        run: pytest

      - name: Coverage threshold — services/repositories >= 85% (TEST-004)
        run: >-
          coverage report
          --include="app/modules/*/service.py,app/modules/*/repository.py"
          --fail-under=85

  frontend-typecheck:
    name: Frontend / type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict type-check (FE-001)
        run: npx tsc --noEmit

  frontend-tests:
    name: Frontend / component tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest + React Testing Library (TEST-010, FE-022)
        run: npm run test

      - name: Production build (DEPLOY-001 — same `tsc && vite build` docker-compose's image runs)
        run: npm run build

  e2e-tests:
    name: E2E / Playwright (TEST-011) + accessibility (A11Y-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright + dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Same Compose stack local development uses, with one addition
      # (e2e/docker-compose.e2e.yml raises SEC-040's per-IP auth rate limit
      # for this ephemeral stack only — see that file's comment). Migrations
      # apply automatically on `api` startup, same as local dev; no
      # production resource (Vercel/Render/S3) is touched by this job.
      - name: Start the Docker Compose stack
        run: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml up -d --build

      - name: Wait for backend + frontend readiness
        run: ./e2e/scripts/wait-for-stack.sh

      # Runs every `e2e/*.spec.ts` file, including `a11y.spec.ts`
      # (A11Y-007's axe-core WCAG 2.1 AA gate) alongside the TEST-011
      # critical-path specs — same command, same stack, no separate step.
      - name: Playwright E2E suite (TEST-011) + accessibility gate (A11Y-007)
        working-directory: e2e
        run: npm test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report (traces/screenshots/video) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml down -v
