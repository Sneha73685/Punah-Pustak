[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "punah-pustak-backend"
version = "2.1.0"
description = "Punah-Pustak V2 backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "pydantic[email]>=2.9,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "pyjwt>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.11,<1.12",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<0.28",
    "pre-commit>=3.8,<4.0",
    "pytest-randomly>=3.15,<4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff: linting + formatting (NFR-004, BE-040)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy: strict mode (NFR-003, BE-040, BE-041)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
mypy_path = "."
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest / coverage (TEST-001..004, TEST-020)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-randomly (installed as a dev dependency) randomizes test order by
# default on every run, satisfying TEST-002's "run with randomized test
# order in CI" requirement with no extra flags needed here.
addopts = "-ra --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
