name: punah-pustak-v2

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: punah
      POSTGRES_PASSWORD: punah
      POSTGRES_DB: punah_pustak
    ports:
      - "5432:5432"
    volumes:
      - punah_pustak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U punah -d punah_pustak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage (BE-030). Only used starting Milestone 2,
  # but included now per DEPLOY-001's fixed four-service compose definition.
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: punah-pustak-local
      MINIO_ROOT_PASSWORD: punah-pustak-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - punah_pustak_storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://punah:punah@db:5432/punah_pustak
      JWT_SECRET: local-dev-secret-change-me-before-deploying
      ACCESS_TOKEN_TTL_MINUTES: "15"
      REFRESH_TOKEN_TTL_DAYS: "30"
      AUTH_RATE_LIMIT_PER_MINUTE: "10"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      STORAGE_ENDPOINT_URL: http://storage:9000
      STORAGE_BUCKET: punah-pustak-listing-images
      STORAGE_ACCESS_KEY: punah-pustak-local
      STORAGE_SECRET_KEY: punah-pustak-local-secret
      COOKIE_SECURE: "false"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  web:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - api

volumes:
  punah_pustak_db_data:
  punah_pustak_storage_data:
