# BE-040: Ruff and mypy MUST be pre-commit hooks, not CI-only surprises.
# Backend-only for now (Milestone 0): the frontend has no source worth
# gating beyond what `tsc` already checks in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, strict)
        # Run from backend/ so pyproject.toml's mypy config (mypy_path = ".")
        # and the bare `app`/`alembic`/`tests` package names resolve the same
        # way they do when a developer runs `mypy app alembic tests` by hand
        # per the README. Requires `backend/.venv` to exist (README setup).
        entry: bash -c "cd backend && .venv/bin/mypy app alembic tests"
        language: system
        files: ^backend/(app|alembic|tests)/.*\.py$
        pass_filenames: false
